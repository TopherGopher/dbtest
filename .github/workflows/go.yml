name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# The token every job gets can read the repository and nothing more.
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # No later step pushes, so the token is not left in the git config.
        persist-credentials: false

    # After the checkout: it reads the Go version from go.mod.
    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Get dependencies
      run: go mod download

    - name: Vet
      run: go vet -v ./...

    - name: Build
      run: go build -v ./...

    # mobyclient is its own module, so the root ./... does not reach it.
    # It stays a separate step until #45 adds a go.work; see #46.
    - name: Vet and build mobyclient
      working-directory: ./mobyclient
      run: |
        go vet -v ./...
        go build -v ./...

    # The exporter is its own module, so that only callers who export pay
    # for mongo-tools.
    - name: Vet and build exporter
      working-directory: ./exporter
      run: |
        go vet -v ./...
        go build -v ./...
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # No later step pushes, so the token is not left in the git config.
        persist-credentials: false
    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: Get dependencies
      run: go mod download

    - name: Test package
      run: go test -v -race -covermode atomic -coverpkg=./... -coverprofile=coverage.out ./...

    # Separate module, so it needs its own invocation. Its conformance and
    # benchmark suites are the same ones dockerapi runs.
    - name: Test mobyclient
      working-directory: ./mobyclient
      run: go test -v -race ./...

    - name: Test exporter
      working-directory: ./exporter
      run: go test -v -race ./...

    - name: Upload code coverage to Coveralls for package
      uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        # The profile "Test package" writes, read as Go's own format.
        file: coverage.out
        format: golang
        # The reporter this action downloads; without it, the newest one.
        coverage-reporter-version: v0.6.22