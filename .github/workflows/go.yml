name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# The token every job gets can read the repository and nothing more.
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # No later step pushes, so the token need not stay in the git config.
        persist-credentials: false

    # After the checkout: it reads the Go version from go.mod.
    - name: Set up Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        # Go is the release named by the toolchain line in the root go.mod.
        # It changes only when a reviewed change edits that line, never by
        # itself when a new patch comes out.
        go-version-file: go.mod

    - name: Get dependencies
      run: go mod download

    # Each module's go.mod pins a Go release, but CI installs only the root's.
    # This step fails if a module pins a different one. To fix it, set the
    # same toolchain line in every go.mod file.
    - name: Check every module pins the Go that CI installs
      run: |
        for dir in . mongotest mongotestv2 mongotest/exporter mobyclient; do
          want=$(awk '$1 == "toolchain" { print $2 }' "$dir/go.mod")
          got=$(cd "$dir" && go env GOVERSION)
          echo "$dir: go.mod pins ${want:-nothing}, CI runs $got"
          if [ "$got" != "$want" ]; then exit 1; fi
        done

    # gofmt works on files, not modules, so one run from the root checks
    # every module.
    - name: Check formatting
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files need gofmt -w:"
          echo "$unformatted"
          exit 1
        fi

    - name: Vet
      run: go vet -v ./...

    - name: Build
      run: go build -v ./...

    # The root ./... does not reach mongotest, mongotestv2, the exporter or
    # mobyclient, which have their own go.mod files, so each gets its own
    # steps. Testing each module from its own go.mod tests the dependency
    # versions that module's users get. A go.work would resolve every
    # module's dependencies together, so the root could be tested against
    # newer versions another module requires.
    #
    # mongotest is its own module, so that only its callers download
    # MongoDB's Go driver.
    - name: Vet and build mongotest
      working-directory: ./mongotest
      run: |
        go vet -v ./...
        go build -v ./...

    # mongotestv2 is its own module, so that its callers build driver v2
    # and no part of driver v1. The module check guards against a v1 import
    # pasted in from the files mongotestv2 copies from mongotest.
    - name: Vet and build mongotestv2
      working-directory: ./mongotestv2
      run: |
        go vet -v ./...
        go build -v ./...
        modules=$(go list -test -deps -f '{{with .Module}}{{.Path}}{{end}}' ./...)
        if printf '%s\n' "$modules" | grep -qx 'go.mongodb.org/mongo-driver'; then
          echo "The mongotestv2 module builds MongoDB's Go driver v1. Import go.mongodb.org/mongo-driver/v2 packages in place of go.mongodb.org/mongo-driver ones."
          exit 1
        fi

    - name: Vet and build mobyclient
      working-directory: ./mobyclient
      run: |
        go vet -v ./...
        go build -v ./...

    # The exporter is its own module, so that only callers who export pay
    # for mongo-tools.
    - name: Vet and build exporter
      working-directory: ./mongotest/exporter
      run: |
        go vet -v ./...
        go build -v ./...

  # Checks that a start reaches mongod in each setup CI commonly runs tests
  # in: sibling containers, the host network, Docker-in-Docker and a daemon
  # over TCP. The test job runs on the daemon's own machine, so it cannot
  # check these. .github/reach-setups.sh prepares each setup. Run it by hand
  # with a setup's name to reproduce a failure.
  reach:
    name: Reach mongod (${{ matrix.setup }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        setup: [sibling, host-network, dind, tcp]
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # No later step pushes, so the token need not stay in the git config.
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod
    # dind runs a privileged docker:dind container. sibling, host-network
    # and tcp give a container the runner's Docker socket.
    - name: Start mongod in this setup and talk to it
      env:
        SETUP: ${{ matrix.setup }}
      run: .github/reach-setups.sh "$SETUP"

  test:
    name: Test (Go ${{ matrix.go || 'pinned in go.mod' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # An empty value uses the release go.mod pins. 1.26.x is the oldest
        # release the Go team still supports, which every module's go line
        # allows. setup-go stops the go command from downloading a newer
        # release, so if a module comes to need one, this leg fails before
        # its users find out.
        go: ['', '1.26.x']
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # No later step pushes, so the token need not stay in the git config.
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        # When go-version is set, it overrides go-version-file. Otherwise Go
        # is the release named by the toolchain line in the root go.mod,
        # which changes only when a reviewed change edits that line.
        go-version: ${{ matrix.go }}
        go-version-file: go.mod
    - name: Get dependencies
      run: go mod download

    # The tests of the reaper, which removes containers when a test run is
    # interrupted, start two helper programs, reaphelper and ignorehelper,
    # and go test does not count coverage in programs the tests start. Setting
    # DBTEST_HELPER_COVERDIR makes the tests build the helpers with coverage
    # and write it to that directory.
    - name: Test package
      env:
        DBTEST_HELPER_COVERDIR: ${{ runner.temp }}/helper-coverage
      run: |
        mkdir -p "$DBTEST_HELPER_COVERDIR"
        go test -v -race -shuffle=on -timeout=30m -covermode atomic -coverpkg=./... -coverprofile=coverage.out ./...

    # Adds the helpers' coverage to coverage.out. The counts for each code
    # block are summed, so code that only a helper runs is reported as
    # covered. Blocks that are not in coverage.out are dropped, so the merge
    # reports no code the tests' own profile leaves out. The first line
    # of each file is its coverage mode, and the two must match for the
    # counts to add up.
    - name: Add the helper programs' coverage
      env:
        DBTEST_HELPER_COVERDIR: ${{ runner.temp }}/helper-coverage
      run: |
        go tool covdata textfmt -i="$DBTEST_HELPER_COVERDIR" -o helpers.out
        awk 'FNR == 1 { if (NR == 1) { mode = $0; print } else if ($0 != mode) { print "coverage modes differ: " $0 > "/dev/stderr"; failed = 1; exit 1 } next }
             { key = $1 " " $2 }
             NR == FNR { if (!(key in count)) order[++n] = key; count[key] += $3; next }
             key in count { count[key] += $3 }
             END { if (failed) exit 1; for (i = 1; i <= n; i++) print order[i], count[order[i]] }' \
          coverage.out helpers.out > merged.out
        mv merged.out coverage.out

    - name: Test mongotest
      working-directory: ./mongotest
      run: go test -v -race -shuffle=on -timeout=30m -covermode atomic -coverpkg=./... -coverprofile=coverage.out ./...

    - name: Test mongotestv2
      working-directory: ./mongotestv2
      run: go test -v -race -shuffle=on -timeout=30m -covermode atomic -coverpkg=./... -coverprofile=coverage.out ./...

    # mobyclient's conformance and benchmark suites are the same ones
    # dockerapi runs.
    - name: Test mobyclient
      working-directory: ./mobyclient
      run: go test -v -race -shuffle=on -timeout=30m -covermode atomic -coverpkg=./... -coverprofile=coverage.out ./...

    - name: Test exporter
      working-directory: ./mongotest/exporter
      run: go test -v -race -shuffle=on -timeout=30m -covermode atomic -coverpkg=./... -coverprofile=coverage.out ./...

    # Writes each module's total to the run's summary page, once, from the
    # leg that uses the Go that go.mod pins. go tool cover runs inside each
    # module, because only that module's go.mod resolves its packages.
    - name: Write the coverage summary
      if: matrix.go == ''
      run: |
        {
          echo "### Test coverage"
          echo ""
          echo "| Module | Statements covered |"
          echo "| --- | --- |"
          for dir in . mongotest mongotestv2 mongotest/exporter mobyclient; do
            total=$(cd "$dir" && go tool cover -func=coverage.out | tail -n 1 | awk '{print $NF}')
            echo "| ${dir/#./root} | $total |"
          done
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload code coverage to Coveralls for every module
      if: matrix.go == ''
      uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        # The coverage profiles from the five test steps, in Go's format,
        # sent as one report.
        files: coverage.out mongotest/coverage.out mongotestv2/coverage.out mongotest/exporter/coverage.out mobyclient/coverage.out
        format: golang
        # Pins the reporter this action downloads. Without it, the action
        # downloads the newest.
        coverage-reporter-version: v0.6.22