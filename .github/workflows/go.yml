name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# The token every job gets can read the repository and nothing more.
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # No later step pushes, so the token is not left in the git config.
        persist-credentials: false

    # After the checkout: it reads the Go version from go.mod.
    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        # The newest patch release of that version, for its security fixes.
        check-latest: true

    - name: Get dependencies
      run: go mod download

    # gofmt reads files, not modules, so one run covers all three.
    - name: Check formatting
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files need gofmt -w:"
          echo "$unformatted"
          exit 1
        fi

    - name: Vet
      run: go vet -v ./...

    - name: Build
      run: go build -v ./...

    # Each module is built and tested from its own go.mod, so CI tests the
    # dependency versions its users get. No go.work is committed: in a
    # workspace the root would be tested against the other modules' newer
    # versions. The root ./... does not reach the other modules.
    - name: Vet and build mobyclient
      working-directory: ./mobyclient
      run: |
        go vet -v ./...
        go build -v ./...

    # The exporter is its own module, so that only callers who export pay
    # for mongo-tools.
    - name: Vet and build exporter
      working-directory: ./exporter
      run: |
        go vet -v ./...
        go build -v ./...
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # No later step pushes, so the token is not left in the git config.
        persist-credentials: false
    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        # The newest patch release of that version, for its security fixes.
        check-latest: true
    - name: Get dependencies
      run: go mod download

    # dockerapi's integration tests call ImagePull directly, which tries once,
    # so a brief refusal from Docker Hub would fail the run. mongod's own
    # pulls retry. Pulling the image here first, with retries, keeps the run
    # from depending on the registry's mood.
    - name: Pull the image the integration tests use
      run: |
        for attempt in 1 2 3 4 5; do
          docker pull mongo:8 && exit 0
          sleep $((attempt * 15))
        done
        exit 1

    - name: Test package
      run: go test -v -race -covermode atomic -coverpkg=./... -coverprofile=coverage.out ./...

    # Separate module, so it needs its own invocation. Its conformance and
    # benchmark suites are the same ones dockerapi runs.
    - name: Test mobyclient
      working-directory: ./mobyclient
      run: go test -v -race -covermode atomic -coverpkg=./... -coverprofile=coverage.out ./...

    - name: Test exporter
      working-directory: ./exporter
      run: go test -v -race -covermode atomic -coverpkg=./... -coverprofile=coverage.out ./...

    - name: Upload code coverage to Coveralls for every module
      uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        # The profiles the three test steps write, read as Go's own format
        # and reported together.
        files: coverage.out mobyclient/coverage.out exporter/coverage.out
        format: golang
        # The reporter this action downloads; without it, the newest one.
        coverage-reporter-version: v0.6.22