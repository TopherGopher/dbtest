# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
# Every entry waits a week before proposing a new release, so one that turns
# out to be compromised is usually withdrawn before it is pinned here.
# Security updates are not held back.
updates:
  # Every go.mod in the repository, so a module added later is covered
  # without editing this file.
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "**/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "pip"
    directory: "/docs" # requirements.in, and the hash-pinned lock compiled from it
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/" # the workflows pin actions to a commit; this moves the pins
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
